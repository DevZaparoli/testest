<svg width="120" height="120" viewBox="-60 -60 120 120" xmlns="http://www.w3.org/2000/svg">
  <title>Mangekyō Sharingan — entrar na dimensão Kamui</title>
  <defs>
    <radialGradient id="iris" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2a2a"/>
      <stop offset="70%" stop-color="#d00010"/>
      <stop offset="100%" stop-color="#7a0008"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="40%" stop-color="#c3000f" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c3000f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle r="58" fill="url(#glow)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <g transform="scale(1.15)">

      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="6s" repeatCount="indefinite"/>
      <circle r="38" fill="#050505"/>
      <circle r="35.5" fill="url(#iris)"/>
      <g fill="#070707">
        <path d="M11.00,0.00 Q25.03,10.11 7.59,35.70 Q7.18,19.73 -0.38,10.99 Z"/>
        <path d="M-5.50,9.53 Q-21.28,16.62 -34.71,-11.28 Q-20.68,-3.65 -9.33,-5.83 Z"/>
        <path d="M-5.50,-9.53 Q-3.76,-26.74 27.12,-24.42 Q13.50,-16.09 9.71,-5.16 Z"/>
        <circle r="12"/>
      </g>
      <circle r="5.5" fill="#d00010"/>
      <circle r="2.6" fill="#070707"/>
    </g>
  </g>
</svg>
